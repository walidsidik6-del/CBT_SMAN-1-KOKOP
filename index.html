<script>
// [kompetensi, tingkat, soal, opsi A-E, indeks kunci, pembahasan]
const Q=[
["Fungsi jaringan","Sedang","Guru di ruang guru selalu memindahkan berkas memakai flashdisk ke komputer TU hanya untuk mencetak, karena printer hanya ada di ruang TU. Fungsi jaringan yang paling tepat dimanfaatkan untuk menyelesaikan masalah ini adalah...",["Komunikasi data melalui surel","Berbagi sumber daya (resource sharing) berupa printer","Menambah kecepatan prosesor komputer guru","Menambah kapasitas RAM komputer guru","Mencadangkan data ke penyimpanan awan"],1,"Printer dapat dipakai bersama lewat jaringan (resource sharing) sehingga flashdisk tidak lagi diperlukan."],
["Jenis jaringan","Sedang","Sebuah sekolah memiliki dua cabang di satu kota dengan jarak sekitar 15 km dan ingin menghubungkan jaringan keduanya. Jenis jaringan yang terbentuk adalah...",["PAN","LAN","MAN","WAN","Peer to peer"],2,"Jangkauan satu kota (kira-kira 10-50 km) termasuk MAN."],
["Jenis jaringan","Sulit","Perhatikan kasus: (1) HP terhubung ke earphone bluetooth, (2) komputer lab dalam satu gedung, (3) dua cabang sekolah dalam satu kota, (4) sekolah mengakses server di negara lain lewat internet. Pasangan jenis jaringan yang benar adalah...",["1-LAN, 2-PAN, 3-MAN, 4-WAN","1-PAN, 2-MAN, 3-LAN, 4-WAN","1-PAN, 2-LAN, 3-WAN, 4-MAN","1-PAN, 2-LAN, 3-MAN, 4-WAN","1-LAN, 2-LAN, 3-MAN, 4-MAN"],3,"Bluetooth jarak dekat = PAN; satu gedung = LAN; satu kota = MAN; antar negara = WAN."],
["Topologi","Sedang","Laboratorium berisi 30 komputer. Sekolah menginginkan topologi yang jika satu kabel komputer putus tidak mengganggu komputer lain, mudah menambah komputer, dan mudah melacak kerusakan. Topologi yang paling sesuai adalah...",["Star","Bus","Ring","Mesh penuh","Bus dengan terminator"],0,"Pada star tiap komputer punya kabel sendiri ke switch pusat, sehingga gangguan satu kabel tidak memengaruhi yang lain dan mudah dilacak."],
["Topologi","Sulit","Sebuah sekolah memakai topologi bus. Kabel backbone putus di bagian tengah. Dampak yang paling mungkin terjadi adalah...",["Hanya komputer paling ujung yang terganggu","Hanya komputer yang paling dekat titik putus yang terganggu","Tidak ada dampak karena ada jalur cadangan","Hanya server yang tidak dapat diakses","Seluruh jaringan terganggu karena backbone tunggal terputus dan sinyal terpantul tanpa terminator"],4,"Bus bergantung pada satu kabel backbone; bila putus, jaringan terpecah dan sinyal memantul sehingga komunikasi umumnya terganggu."],
["Topologi","Sulit","Ruang server memiliki 5 komputer dan membutuhkan keandalan sangat tinggi: jika satu jalur rusak, data tetap terkirim lewat jalur lain. Biaya kabel bukan kendala. Topologi yang tepat dan alasannya adalah...",["Bus, karena kabelnya murah","Star, karena switch pusat tidak pernah rusak","Mesh, karena setiap perangkat punya banyak jalur alternatif","Ring, karena satu putus tetap aman pada semua kondisi","Tree, karena hanya memiliki satu jalur"],2,"Mesh punya banyak jalur redundan sehingga paling andal, dengan konsekuensi kabel dan konfigurasi lebih banyak."],
["Perangkat jaringan","Sedang","Gedung B berjarak 120 m dari switch di gedung A. Dengan kabel UTP, sinyal melemah dan komputer di gedung B sering putus. Perangkat yang paling tepat dipasang di tengah jalur adalah...",["Modem","Printer server","Kabel crossover pada ujung","Repeater","Network interface card tambahan"],3,"UTP maksimal sekitar 100 m. Repeater menguatkan dan meneruskan sinyal sehingga jarak dapat diperpanjang."],
["Perangkat jaringan","Sulit","Jaringan lab 192.168.1.0/24 dan jaringan guru 192.168.2.0/24 ingin saling berkomunikasi. Perangkat yang wajib ada adalah...",["Router","Hub","Repeater","Access point","Kartu jaringan (NIC)"],0,"Dua network berbeda hanya dapat berkomunikasi melalui router yang meneruskan paket antar-network (layer 3)."],
["Troubleshooting","Sulit","Saat ujian CBT, komputer Meja 7 tidak terhubung ke server. Lampu link NIC Meja 7 mati, sedangkan komputer lain dan port switch lainnya normal. Langkah pertama yang paling logis adalah...",["Instal ulang sistem operasi semua komputer","Mengganti server ujian","Mengubah subnet mask semua komputer menjadi /16","Mengganti seluruh switch","Memeriksa kabel UTP, konektor RJ-45, dan port switch untuk Meja 7"],4,"Masalah hanya pada satu komputer dengan lampu link mati menunjukkan gangguan fisik di jalur Meja 7."],
["IPv4","Sedang","Admin mencatat beberapa alamat IP untuk komputer lab. Alamat yang valid sebagai IPv4 adalah...",["192.168.1.256","192.168.10.1.5","172.16.5.254","192.168.-1.10","10.256.0.1"],2,"IPv4 terdiri dari 4 oktet dengan nilai 0-255. Hanya 172.16.5.254 yang memenuhi."],
["Network & host","Sedang","PC-A 192.168.5.10/24 dan PC-B 192.168.6.10/24 terhubung ke switch yang sama tetapi tidak bisa saling ping. Penjelasan yang paling tepat adalah...",["Subnet mask terlalu kecil","Keduanya berada di network berbeda (192.168.5.0 dan 192.168.6.0) sehingga perlu router","Host ID keduanya sama","Kelas IP berbeda sehingga tidak bisa digunakan","Kabel keduanya pasti rusak"],1,"Network ID pada /24 adalah tiga oktet pertama; berbeda sehingga butuh router."],
["Analisis alamat IP","Sedang","Tabel IP komputer: Meja1 192.168.10.11, Meja2 192.168.10.12, Meja3 192.168.10.11, Meja4 192.168.10.14 (semua /24). Muncul pesan 'IP address conflict'. Komputer yang mengalami konflik adalah...",["Meja 1 dan Meja 2","Meja 2 dan Meja 4","Meja 3 dan Meja 4","Meja 1 dan Meja 3","Semua meja"],3,"Meja 1 dan Meja 3 memakai alamat yang sama (192.168.10.11)."],
["Desimal ke biner","Sedang","Komputer admin memiliki IP 172.16.10.202. Oktet terakhir (202) jika dikonversi ke biner adalah...",["11001010","11001100","11010010","10101010","11000110"],0,"202 = 128+64+8+2, sehingga bitnya 11001010."],
["Biner ke desimal","Sedang","Sebuah IPv4 ditulis 10101100.00010000.00001010.00000001. Dalam notasi desimal bertitik, alamat tersebut adalah...",["172.16.10.2","172.32.10.1","174.16.10.1","172.16.12.1","172.16.10.1"],4,"10101100=172, 00010000=16, 00001010=10, 00000001=1."],
["Nilai bit subnet mask","Sulit","Subnet mask 11111111.11111111.11111111.11100000 digunakan pada jaringan perpustakaan. Notasi CIDR dan jumlah host yang dapat dipakai adalah...",["/28 dengan 14 host","/27 dengan 32 host","/27 dengan 30 host","/26 dengan 62 host","/29 dengan 6 host"],2,"Ada 27 bit 1 (/27) dan 5 bit host: 2^5-2 = 30 host. Nilai 32 masih termasuk alamat network dan broadcast."],
["Subnetting /26","Sulit","Lab memiliki 50 komputer dan jaringan 192.168.10.0/24 dibagi menjadi subnet berukuran sama sebanyak mungkin, tetapi setiap subnet harus tetap menampung 50 komputer. Prefix dan jumlah subnet yang tepat adalah...",["/25 - 255.255.255.128 - 2 subnet (126 host)","/26 - 255.255.255.192 - 4 subnet (62 host)","/27 - 255.255.255.224 - 8 subnet (30 host)","/28 - 255.255.255.240 - 16 subnet (14 host)","/24 - tidak dibagi"],1,"/27 hanya 30 host (kurang), /26 menyediakan 62 host (cukup) dan menghasilkan 2^2 = 4 subnet."],
["Network & broadcast /27","Sulit","Komputer guru memakai IP 192.168.10.70/27. Network address dan broadcast address-nya adalah...",["192.168.10.32 dan 192.168.10.63","192.168.10.64 dan 192.168.10.127","192.168.10.65 dan 192.168.10.94","192.168.10.64 dan 192.168.10.95","192.168.10.70 dan 192.168.10.95"],3,"Blok = 256-224 = 32. Kelipatan 32 terdekat di bawah 70 adalah 64, jadi network .64 dan broadcast .95."],
["Jumlah host /27, /28","Sulit","Perpustakaan memiliki 10 PC, 2 printer, 1 access point, dan 1 router (gateway), serta akan menambah 3 perangkat. Prefix paling hemat dari 192.168.20.0 yang masih mencukupi adalah...",["/27 (30 host)","/28 (14 host)","/26 (62 host)","/29 (6 host)","/25 (126 host)"],0,"Total 14+3 = 17 perangkat. /28 hanya 14 host, /27 menyediakan 30 host dan paling hemat."],
["Subnetting /29","Sulit","Jaringan 192.168.30.0 dibagi dengan /29. Rentang IP host pada subnet ketiga adalah...",["192.168.30.16 - 192.168.30.23","192.168.30.17 - 192.168.30.22","192.168.30.8 - 192.168.30.15","192.168.30.9 - 192.168.30.14","192.168.30.17 - 192.168.30.23"],1,"Blok 8: subnet 1 .0, subnet 2 .8, subnet 3 .16. Network .16, broadcast .23, host .17-.22."],
["Konfigurasi /25","Sulit","Admin mengatur PC: IP 192.168.10.130, subnet mask 255.255.255.128, gateway 192.168.10.1. PC tidak bisa keluar jaringan. Kesalahan dan perbaikannya adalah...",["Subnet mask salah, harus 255.255.255.0","IP PC salah, harus 192.168.10.1","Tidak ada kesalahan karena tiga oktet pertama sama","Gateway sudah benar, masalah ada pada DNS","Gateway di luar subnet PC (192.168.10.128/25); ganti ke 192.168.10.129 atau 192.168.10.254"],4,"Pada /25, PC berada di network 192.168.10.128 dengan host .129-.254, sehingga gateway .1 berada di network lain."]
];
// [soal, kunci jawaban, skor maks]
const E=[
["Sebuah sekolah memiliki jaringan komputer pada laboratorium, ruang guru, perpustakaan, dan ruang tata usaha. Jelaskan jenis jaringan dan perangkat jaringan yang sesuai untuk menghubungkan seluruh ruangan tersebut. Berikan alasan berdasarkan kebutuhan jaringan.","Jenis: LAN (satu lingkungan sekolah, jarak dekat). Topologi star atau tree. Perangkat: NIC pada setiap komputer, kabel UTP, switch di tiap ruangan dan switch utama/inti, router untuk akses internet (dan antar-subnet bila dipisah), modem dari ISP, access point untuk Wi-Fi, repeater/switch tambahan bila jarak lebih dari 100 m. Alasan: kecepatan tinggi, biaya terjangkau, berbagi printer/berkas/internet, dan mudah dikelola.<br><b>Rubrik:</b> jenis (2), perangkat (3), alasan (3)."],
["Sebuah laboratorium memiliki 60 komputer dan menggunakan jaringan 192.168.20.0/24. Administrator ingin membagi jaringan menjadi beberapa subnet. Tentukan subnet mask yang sesuai, jumlah subnet, jumlah host tiap subnet, network address, broadcast address, dan rentang host salah satu subnet. Jelaskan langkah perhitungannya.","Kebutuhan 60 host (+gateway). 2^6-2 = 62 &ge; 60, sehingga bit host = 6 dan prefix = /26. Mask 255.255.255.192. Meminjam 2 bit sehingga 2^2 = 4 subnet, tiap subnet 62 host. Blok = 64. Subnet 1: network 192.168.20.0, broadcast .63, host .1-.62. Subnet lain: .64/.127, .128/.191, .192/.255.<br><b>Rubrik:</b> mask/prefix (2), jumlah subnet & host (2), network & broadcast (2), rentang host (1), langkah (1)."],
["Diberikan alamat IP 192.168.50.75/26. Tentukan subnet mask, network address, broadcast address, first host, last host, dan jumlah host yang dapat digunakan. Jelaskan proses perhitungan secara sistematis.","/26 = 26 bit 1, oktet ke-4 = 11000000 = 192, mask 255.255.255.192. Blok = 256-192 = 64. 75 berada pada 64-127. Network 192.168.50.64, broadcast 192.168.50.127, first host .65, last host .126, jumlah host 2^6-2 = 62.<br><b>Rubrik:</b> mask (1), blok (1), network (1.5), broadcast (1.5), first/last host (2), jumlah host & langkah (1)."],
["Sebuah sekolah menggunakan topologi star. Salah satu switch utama mengalami kerusakan sehingga beberapa komputer tidak dapat terhubung ke jaringan. Analisis penyebab masalah, bagian jaringan yang terdampak, perangkat yang perlu diperiksa, solusi yang dapat dilakukan, dan alasan pemilihan solusi.","Penyebab: switch merupakan titik pusat (single point of failure) sehingga kerusakannya memutus semua komputer yang terhubung ke switch itu. Terdampak: komputer (dan switch turunan) di bawah switch tersebut; jika switch inti maka akses ke server dan internet ikut terganggu. Diperiksa: lampu indikator, adaptor daya, port, kabel UTP/uplink, lalu konfigurasi. Solusi: ganti atau perbaiki switch, pasang switch cadangan, pindahkan kabel ke port/switch lain, dan jangka panjang tambah redundansi uplink. Alasan: cepat memulihkan layanan dengan biaya wajar dan tidak mengubah seluruh topologi.<br><b>Rubrik:</b> penyebab (2), dampak (1.5), perangkat (1.5), solusi (1.5), alasan (1.5)."],
["Seorang administrator mendapatkan jaringan 192.168.100.0/24 dan harus membaginya untuk: Laboratorium 100 host, Ruang Guru 40 host, Tata Usaha 20 host, Perpustakaan 10 host. Analisis pembagian subnet yang sesuai. Tentukan prefix yang digunakan untuk setiap bagian dan tuliskan network address serta rentang hostnya.","Gunakan VLSM, urutkan dari terbesar. Lab 100 host &rarr; /25 (126): 192.168.100.0/25, host .1-.126, broadcast .127. Guru 40 &rarr; /26 (62): 192.168.100.128/26, host .129-.190, broadcast .191. TU 20 &rarr; /27 (30): 192.168.100.192/27, host .193-.222, broadcast .223. Perpustakaan 10 &rarr; /28 (14): 192.168.100.224/28, host .225-.238, broadcast .239. Sisa .240-.255 belum terpakai.<br><b>Rubrik:</b> metode VLSM (1), prefix keempat bagian (2), network address (2.5), rentang host (2.5)."]
];

const ENDPOINT="https://script.google.com/macros/s/AKfycbzw_5oi3nAKNdb7X_WgO4-6e2rvJCOMfFWDMiCTxUGJJfZrxcoQNICh8QB9p2KyKhjwVg/exec";
const KEY="cbt_inf11_jarkom_v2",DUR=90*60,L="ABCDE",MAXE=8;
let S=load(),tick=null,DB=null,UID=null,TEACH=false,NET="cek",VIEW="",H={},N={},ESS=null,unsub=null,OPEN={},RW=[],watching=false,busy=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const kn=()=>String(S.nis||"").replace(/[^A-Za-z0-9_-]/g,"_")||"x";
const shuf=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NT={cek:"Menghubungkan ke server pusat...",ok:"Server pusat terhubung",off:"Server pusat belum dikonfigurasi (ENDPOINT kosong). Nilai hanya tersimpan di perangkat.",err:"Gagal mengirim ke server, mencoba lagi otomatis."};
function badge(){document.querySelectorAll(".net").forEach(e=>{e.textContent=NT[NET];e.style.color=NET==="ok"?"var(--ok)":NET==="cek"?"var(--m)":"var(--no)"})}
function modal(h){const m=$("#mo");m.innerHTML="<div>"+h+"</div>";m.style.display="flex"}
function closeM(){$("#mo").style.display="none"}
function render(){clearInterval(tick);VIEW="";const a=$("#app");
if(!S.nama){a.innerHTML=`<div class="card"><h1>Computer Based Test Informatika</h1><div class="m">Kelas XI SMA &bull; Jaringan Komputer &amp; Perhitungan IP Address &bull; HOTS</div><hr style="border:0;border-top:1px solid var(--b);margin:14px 0">
<h2>Cara Pengerjaan</h2><ol style="padding-left:20px;margin:6px 0 14px"><li>Isi nama lengkap, kelas, dan NIS, lalu tekan <b>Mulai Ujian</b>. Waktu 90 menit langsung berjalan.</li><li>Ujian terdiri dari 20 soal pilihan ganda (A-E) dan 5 soal esai. Urutan soal dan pilihan jawaban berbeda untuk tiap peserta.</li><li>Pilih satu jawaban untuk soal pilihan ganda; jawaban boleh diganti sebelum dikumpulkan. Untuk esai, ketik jawaban beserta langkah perhitungannya.</li><li>Gunakan nomor soal untuk berpindah soal dan tombol <b>Ragu-ragu</b> untuk menandai soal yang ingin diperiksa lagi.</li><li>Jawaban tersimpan otomatis. Jika halaman tertutup, buka kembali di perangkat yang sama untuk melanjutkan.</li><li>Jangan berpindah tab atau jendela selama ujian karena akan dicatat.</li><li>Tekan <b>Selesai &amp; Kumpulkan</b> setelah semua dijawab, atau otomatis saat waktu habis. Setelah dikumpulkan, jawaban tidak dapat diubah dan hasil diumumkan oleh guru.</li></ol>
<label>Nama lengkap<input id="n" maxlength="60"></label><label>Kelas<input id="k" maxlength="20" placeholder="contoh: XI-3"></label><label>NIS / No. absen<input id="s" maxlength="20"></label>
<div id="er" class="no"></div><div class="m net" style="margin-bottom:10px"></div><div class="bar" style="margin-top:0"><button class="p" onclick="start()">Mulai Ujian</button>${TEACH?'<button onclick="guru()">Rekap Guru</button>':""}</div></div>`;badge();return}
if(S.done){result();return}
exam()}
function start(){const n=$("#n").value.trim(),k=$("#k").value.trim(),s=$("#s").value.trim();
if(!n||!k||!s){$("#er").textContent="Nama, kelas, dan NIS wajib diisi.";return}
S={nama:n,kelas:k,nis:s,start:Date.now(),end:Date.now()+DUR*1000,ans:{},ragu:{},es:{},i:0,sw:0,done:false,sent:false,ord:shuf(20),op:Q.map(()=>shuf(5))};save();sendRes();render()}
function exam(){const i=S.i,mc=i<20,qi=mc?S.ord[i]:-1,a=$("#app");
const nav=[...Array(25)].map((_,j)=>{const done=j<20?S.ans[S.ord[j]]!=null:(S.es[j-20]||"").trim();return`<button class="${S.ragu[j]?"g":done?"a":""} ${j==i?"c":""}" onclick="go(${j})">${j+1}</button>`}).join("");
let body;
if(mc){const q=Q[qi];body=`<span class="tag">${esc(q[0])}</span><span class="tag">${q[1]}</span><h2 style="margin-top:10px">Soal ${i+1} dari 25 (Pilihan Ganda)</h2><p>${esc(q[2])}</p>`+S.op[qi].map((oj,p)=>`<button class="opt ${S.ans[qi]===oj?"s":""}" onclick="pick(${oj})"><b>${L[p]}.</b><span>${esc(q[3][oj])}</span></button>`).join("")}
else{body=`<span class="tag">Esai HOTS</span><h2 style="margin-top:10px">Soal ${i+1} dari 25 (Esai ${i-19})</h2><p>${esc(E[i-20][0])}</p><textarea id="es" placeholder="Tulis jawaban dan langkah perhitungan Anda di sini..." oninput="setEs(this.value)"></textarea><div class="m">Jawaban tersimpan otomatis.</div>`}
const ans=Q.filter((_,j)=>S.ans[j]!=null).length,esn=[...Array(5)].filter((_,j)=>(S.es[j]||"").trim()).length;
a.innerHTML=`<div class="card top"><div><b>${esc(S.nama)}</b> <span class="m">${esc(S.kelas)} &bull; ${esc(S.nis)}</span><div class="m">PG ${ans}/20 &bull; Esai ${esn}/5</div><div class="m net"></div></div><div id="tm"></div></div>
<div class="card"><div class="nav">${nav}</div><div class="m" style="margin-top:8px">Biru = terjawab, kuning = ragu-ragu, garis tebal = soal aktif</div></div>
<div class="card">${body}<div class="bar"><button onclick="go(${i-1})" ${i==0?"disabled":""}>&larr; Sebelumnya</button><button onclick="flag()">${S.ragu[i]?"Batal ragu-ragu":"Ragu-ragu"}</button>${i<24?`<button class="p" onclick="go(${i+1})">Berikutnya &rarr;</button>`:`<button class="r" onclick="ask()">Selesai &amp; Kumpulkan</button>`}</div></div><div class="card"><button class="r" onclick="ask()">Selesai &amp; Kumpulkan</button></div>`;
if(!mc)$("#es").value=S.es[i-20]||"";badge();
const t=()=>{const r=Math.max(0,Math.floor((S.end-Date.now())/1000)),e=$("#tm");if(!e)return;e.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");e.className=r<300?"low":"";if(r<=0){clearInterval(tick);finish()}};t();tick=setInterval(t,1000)}
function go(n){if(n<0||n>24)return;S.i=n;save();render();window.scrollTo(0,0)}
function pick(oj){S.ans[S.ord[S.i]]=oj;save();render()}
function flag(){S.ragu[S.i]=!S.ragu[S.i];save();render()}
function setEs(v){S.es[S.i-20]=v;save()}
function ask(){const u=Q.filter((_,j)=>S.ans[j]==null).length,e=[...Array(5)].filter((_,j)=>!(S.es[j]||"").trim()).length;
modal(`<h2>Kumpulkan jawaban?</h2><p>Belum dijawab: ${u} soal PG dan ${e} soal esai. Setelah dikumpulkan, jawaban tidak dapat diubah.</p><div class="bar"><button onclick="closeM()">Kembali</button><button class="r" onclick="closeM();finish()">Ya, kumpulkan</button></div>`)}
function finish(){if(S.done)return;S.done=true;S.fin=Date.now();S.sent=false;save();render();sendRes()}
function total(){const b=Q.filter((q,j)=>S.ans[j]===q[4]).length;return{b,pg:b*3}}
async function sendRes(){if(!ENDPOINT&&(!DB||!UID)){NET="off";badge();return}
if(busy)return;busy=true;const r=total(),k=kn(),e={nama:S.nama,kelas:S.kelas,nis:S.nis,status:S.done?"selesai":"mengerjakan",benar:r.b,pg:r.pg,start:S.start||0,fin:S.fin||0,sw:S.sw||0,es:S.es||{},ans:S.ans||{}};
try{if(ENDPOINT){const es=[0,1,2,3,4].map(j=>(S.es||{})[j]||"");await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({nama:e.nama,kelas:e.kelas,nis:e.nis,status:e.status,benar:e.benar,pg:e.pg,sw:e.sw,es})})}else{try{await DB.doc("hasil/"+UID).update({entries:{[k]:e}})}catch(x){await DB.doc("hasil/"+UID).set({entries:{[k]:e}})}}
NET="ok";if(S.done){S.sent=true;save();watchEs()}}catch(x){NET="err"}
busy=false;badge();sent()}
function sent(){const e=$("#snt");if(e)e.innerHTML=S.sent?'<b class="ok">Jawaban sudah terkirim ke server pusat.</b>':'<b class="no">Jawaban belum terkirim. Jangan tutup halaman ini.</b> <button onclick="sendRes()">Kirim ulang</button>'}
function watchEs(){if(!DB||!UID||watching)return;watching=true;DB.doc("nilai/"+UID+"__"+kn()).onSnapshot(s=>{ESS=s.exists?(s.data().es||{}):null;fill()},()=>{})}
function fill(){const r=total(),re=$("#re");if(!re)return;const s=ESS?Object.values(ESS).reduce((x,y)=>x+(+y||0),0):null;
re.textContent=ESS?s+" / 40":"dinilai guru";$("#rt").textContent=ESS?r.pg+s:r.pg;$("#rn").textContent=ESS?"":"(sementara, baru pilihan ganda)"}
function result(){$("#app").innerHTML=`<div class="card"><h1>Ujian Selesai</h1><div><b>${esc(S.nama)}</b> &bull; ${esc(S.kelas)} &bull; NIS ${esc(S.nis)}</div><div class="m">Dikumpulkan: ${new Date(S.fin).toLocaleString("id-ID")}</div><p>Terima kasih. Jawaban Anda sudah dikumpulkan. Hasil akan diumumkan oleh guru.</p><div id="snt"></div><div class="m net"></div><div class="bar np"><button class="r" onclick="reset()">Peserta Baru</button></div></div>`;sent();badge()}
function reset(){modal(`<h2>Hapus data di perangkat ini?</h2><p>Data lokal peserta ini dihapus. Pastikan status sudah 'terkirim'; data yang sudah terkirim tetap ada di server pusat.</p><div class="bar"><button onclick="closeM()">Batal</button><button class="r" onclick="closeM();S={};ESS=null;watching=false;try{localStorage.removeItem(KEY)}catch(e){};render()">Hapus</button></div>`)}
// ===== Rekap guru =====
function guru(){VIEW="guru";if(!DB){VIEW="";modal('<h2>Server tidak tersambung</h2><p>Buka aplikasi lewat akun claude.ai pemilik.</p><div class="bar"><button onclick="closeM()">Tutup</button></div>');return}
if(!unsub){const e=()=>{};const a=DB.collection("hasil").onSnapshot(s=>{H={};s.docs.forEach(d=>{H[d.id]=(d.data()||{}).entries||{}});gup()},e);const b=DB.collection("nilai").onSnapshot(s=>{N={};s.docs.forEach(d=>{N[d.id]=(d.data()||{}).es||{}});gup()},e);unsub=()=>{a();b()}}
gview()}
function gup(){if(VIEW==="guru"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))gview()}
function rows(){const R=[];Object.keys(H).forEach(u=>Object.keys(H[u]).forEach(k=>{const e=H[u][k],n=N[u+"__"+k],s=n?Object.values(n).reduce((x,y)=>x+(+y||0),0):null;R.push({u,k,e,n,s,t:(e.pg||0)+(s||0)})}));return R.sort((a,b)=>((a.e.kelas||"")+(a.e.nama||"")).localeCompare((b.e.kelas||"")+(b.e.nama||"")))}
function gview(){RW=rows();const fin=RW.filter(r=>r.e.status==="selesai"),avg=fin.length?(fin.reduce((x,r)=>x+r.t,0)/fin.length).toFixed(1):"-";
const list=RW.map((r,i)=>{const e=r.e,es=E.map((q,j)=>`<div style="margin-top:12px"><b>Esai ${j+1}</b> <span class="m">${esc(q[0])}</span><div class="ans">${esc((e.es||{})[j]||"(tidak dijawab)")}</div><div class="key"><b>Kunci &amp; rubrik:</b> ${q[1]}</div>Skor (0-${MAXE}): <input class="sc" type="number" min="0" max="${MAXE}" step="0.5" value="${r.n&&r.n[j]!=null?r.n[j]:""}" onchange="gs(${i},${j},this)"></div>`).join("");
return`<details class="card" ${OPEN[i]?"open":""} ontoggle="OPEN[${i}]=this.open"><summary><b>${esc(e.nama)}</b> &bull; ${esc(e.kelas)} &bull; ${esc(e.nis)} &bull; ${e.status==="selesai"?'<span class="ok">selesai</span>':'<span class="m">mengerjakan</span>'} &bull; PG ${e.pg||0}/60 &bull; Esai ${r.s==null?"-":r.s}/40 &bull; <b>Total ${r.t}</b> &bull; Pindah tab ${e.sw||0}</summary>${es}</details>`}).join("");
$("#app").innerHTML=`<div class="card"><h1>Rekap Nilai (Guru)</h1><div class="m">Diperbarui otomatis. Peserta: ${RW.length} &bull; Selesai: ${fin.length} &bull; Rata-rata total (selesai): ${avg}</div><div class="bar"><button onclick="VIEW='';render()">&larr; Kembali</button><button class="p" onclick="csv()">Unduh CSV</button></div></div>${list||'<div class="card m">Belum ada data peserta.</div>'}`}
function gs(i,j,el){const r=RW[i];let v=parseFloat(el.value);if(isNaN(v)||v<0)v=0;if(v>MAXE)v=MAXE;el.value=v;const cur=Object.assign({},r.n||{});cur[j]=v;DB.doc("nilai/"+r.u+"__"+r.k).set({es:cur}).catch(()=>{})}
async function csv(){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"',h=["Nama","Kelas","NIS","Status","PG Benar","Skor PG","Skor Esai","Nilai Akhir","Pindah Tab"],d=[h].concat(RW.map(r=>[r.e.nama,r.e.kelas,r.e.nis,r.e.status,r.e.benar,r.e.pg,r.s==null?"":r.s,r.t,r.e.sw||0]));
try{const dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:"rekap-nilai-informatika-xi.csv",data:"\ufeff"+d.map(x=>x.map(q).join(",")).join("\n")})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.nama&&!S.done){S.sw=(S.sw||0)+1;save()}});
setInterval(()=>{if(S.done&&!S.sent&&DB)sendRes()},15000);
render();
(async()=>{try{if(ENDPOINT){NET="ok";badge();if(S.done&&!S.sent)sendRes();return}
if(!window.claude){NET="off";badge();return}
const r=await Promise.all([claude.use("db"),claude.use("user")]);DB=r[0];const u=r[1];
if(u){try{UID=await u.id();TEACH=await u.canEdit()}catch(e){}}
NET=DB&&UID?"ok":"off"}catch(e){NET="off"}
badge();if(!S.nama&&VIEW==="")render();
if(S.done){if(!S.sent)sendRes();else watchEs()}})();
</script></body></html>
